<title>Dürüm Symfoni</title>
<script>
  // Gamle adresser fra den tidligere hjemmeside (fx /takeaway, /menu, /order)
  // sendes videre til bestillingssiden. Alt andet sendes til forsiden.
  (function(){
    var p = location.pathname.toLowerCase();
    var bestil = /takeaway|menu|order|bestil|checkout|kurv|cart|product|produkt|category|kategori/.test(p);
    location.replace(bestil ? "https://durumsymfoni.orderyoyo.dk/" : "/" + location.search);
  })();
</script>
